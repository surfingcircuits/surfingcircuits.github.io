<!-- Carga model-viewer -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  .viewer-frame {
    border: 3px solid #ccc;
    border-radius: 12px;
    padding: 15px;
    background: #f0f0f0;
    max-width: 950px;
    margin: auto;
  }

  #mv {
    width: 100%;
    height: 500px;
    border-radius: 8px;
    background: #e6e6e6; /* Gris claro */
  }

  .controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    align-items: center;
  }

  .controls label {
    font-size: 14px;
    display: block;
  }

  .controls input[type="range"] {
    width: 100%;
  }

  .controls button {
    padding: 10px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    background: #0073e6;
    color: white;
    border: none;
  }

  .controls button:hover { background: #005bb5; }
</style>

<div class="viewer-frame">
  <model-viewer id="mv"
      src="{{ '/assets/3Dmodels/RE-260RA_DC_motor.gltf' | relative_url }}"
      alt="Modelo 3D"
      camera-controls
      auto-rotate
      auto-rotate-delay="800"
      shadow-intensity="1"
      exposure="1.2"
      environment-image="neutral"
      style="width: 100%; height: 500px;">
  </model-viewer>

  <div class="controls">

      <button id="autoBtn" onclick="toggleAutoRotate()">Auto-rotar: ON</button>

      <label>
        Sombras:
        <input type="range" id="shadowSlider" min="0" max="1" value="1" step="0.01"
               oninput="updateShadow(this.value)">
      </label>

      <label>
        Exposición:
        <input type="range" id="exposureSlider" min="0" max="2" value="1.2" step="0.05"
               oninput="updateExposure(this.value)">
      </label>

  </div>
</div>

<script>
  const mv = document.getElementById("mv");
  const autoBtn = document.getElementById("autoBtn");
  let autoRotating = true;

  /* Fijar ACES siempre */
  mv.toneMapping = "aces";

  /* Fondo gris claro */
  mv.style.backgroundColor = "#e6e6e6";

  function toggleAutoRotate() {
    autoRotating = !autoRotating;
    mv.autoRotate = autoRotating;
    autoBtn.textContent = "Auto-rotar: " + (autoRotating ? "ON" : "OFF");
  }

  function updateShadow(val) {
    mv.shadowIntensity = parseFloat(val);
  }

  function updateExposure(val) {
    mv.exposure = parseFloat(val);
  }
</script>
