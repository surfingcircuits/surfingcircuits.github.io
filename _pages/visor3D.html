<script>
  const mv = document.getElementById("mv");
  const autoBtn = document.getElementById("autoBtn");
  const modelSelect = document.getElementById("modelSelect");
  let autoRotating = true;

  /* Fijar ACES siempre */
  mv.toneMapping = "aces";

  /* Fondo gris claro */
  mv.style.backgroundColor = "#e6e6e6";

  /* Funciones básicas */
  function toggleAutoRotate() {
    autoRotating = !autoRotating;
    mv.autoRotate = autoRotating;
    autoBtn.textContent = "Auto-rotar: " + (autoRotating ? "ON" : "OFF");
  }

  function updateShadow(val) {
    mv.shadowIntensity = parseFloat(val);
  }

  function updateExposure(val) {
    mv.exposure = parseFloat(val);
  }

  function changeModel(nombre) {
    mv.src = `{{ '/assets/3Dmodels/' | relative_url }}${nombre}`;
  }

  /* NUEVO: función para cambiar color de fondo */
  function changeBackground(val) {
    mv.style.backgroundColor = val;
  }

  /* Cargar modelo desde URL si existe, sino modelo por defecto */
  const params = new URLSearchParams(window.location.search);
  const modelParam = params.get("model");
  const defaultModel = "visor3D_text.gltf";

  if(modelParam) {
    changeModel(modelParam);
    modelSelect.value = modelParam;
  } else {
    changeModel(defaultModel);
    modelSelect.value = defaultModel;
  }
</script>

<!-- CDN Three.js -->
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/loaders/GLTFLoader.js";

let scene, camera, renderer, controls, loader;
let currentModel = null;
let autoRotate = true;

/* -------------------------------------------- */
/* INITIAL SETUP                                */
/* -------------------------------------------- */
function init() {
    const container = document.getElementById("viewerContainer");

    scene = new THREE.Scene();
    scene.background = new THREE.Color("#e6e6e6"); // Fondo gris claro

    camera = new THREE.PerspectiveCamera(55, container.clientWidth / 500, 0.1, 1000);
    camera.position.set(2, 2, 3);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, 500);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Controles orbitales
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;

    // Luz principal
    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(3, 5, 3);
    light.castShadow = true;
    scene.add(light);

    // Luz ambiental
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    loader = new GLTFLoader();

    animate();
}

/* -------------------------------------------- */
/* LOAD MODEL                                    */
/* -------------------------------------------- */
function loadModel(modelName) {
    const path = `/assets/3Dmodels/${modelName}`;

    if (currentModel) {
        scene.remove(currentModel);
    }

    loader.load(path, gltf => {
        currentModel = gltf.scene;
        currentModel.traverse(node => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;
            }
        });

        scene.add(currentModel);

        // Auto-centering
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);

    }, undefined, error => {
        console.error("Error al cargar el modelo:", error);
    });
}

/* -------------------------------------------- */
/* ANIMATION LOOP                                */
/* -------------------------------------------- */
function animate() {
    requestAnimationFrame(animate);
    controls.autoRotate = autoRotate;
    controls.update();
    renderer.render(scene, camera);
}

/* -------------------------------------------- */
/* UI HANDLERS                                   */
/* -------------------------------------------- */
window.toggleAutoRotate = function () {
    autoRotate = !autoRotate;
    document.getElementById("autoBtn").textContent =
        `Auto-rotar: ${autoRotate ? "ON" : "OFF"}`;
};

window.updateShadow = function (v) {
    scene.traverse(obj => {
        if (obj.isDirectionalLight) obj.intensity = parseFloat(v);
    });
};

window.updateExposure = function (v) {
    renderer.toneMappingExposure = parseFloat(v);
};

window.changeBackground = function (v) {
    scene.background = new THREE.Color(v);
};

window.changeModel = function (name) {
    loadModel(name);
};

/* -------------------------------------------- */
/* LOAD INITIAL MODEL                            */
/* -------------------------------------------- */
window.addEventListener("DOMContentLoaded", () => {
    init();

    const urlParams = new URLSearchParams(window.location.search);
    const modelParam = urlParams.get("model");

    const defaultModel = "RE-260RA_DC_motor.gltf";

    const select = document.getElementById("modelSelect");
    select.value = modelParam || defaultModel;

    loadModel(select.value);
});
</script>
